# Local / prod-like stack: bot + postgres + redis.
# Copy .env.example to .env and fill BOT_TOKEN, ADMIN_IDS, ADMIN_GROUP_ID first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-volunteers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volunteers}
      POSTGRES_DB: ${POSTGRES_DB:-volunteers}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volunteers}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-volunteers}:${POSTGRES_PASSWORD:-volunteers}@postgres:5432/${POSTGRES_DB:-volunteers}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: ["python", "-m", "app.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-volunteers}:${POSTGRES_PASSWORD:-volunteers}@postgres:5432/${POSTGRES_DB:-volunteers}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
